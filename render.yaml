databases:
  - name: javen-waitlist-db
    plan: free
    databaseName: javen_waitlist
    user: javen

services:
  - type: web
    name: javen-waitlist
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: javen-waitlist-db
          property: connectionString
