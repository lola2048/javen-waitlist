<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Javen · 抢先体验 AI Vlog 导演" />
  <meta name="theme-color" content="#1a1410" />
  <title>Javen · 抢先体验</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260802-film2" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="film-wash" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar">
      <div class="logo">
        <span class="logo-frame" aria-hidden="true"></span>
        <div class="logo-text">
          <strong>Javen</strong>
          <span data-i18n="logoMain">你的 AI Vlog 导演</span>
        </div>
      </div>
      <button class="lang-toggle" id="langToggle" type="button">EN</button>
    </header>

    <section class="hero">
      <span class="hero-badge" data-i18n="badge">抢先体验</span>
      <h1 data-i18n="title">Javen</h1>
      <p class="hero-desc" data-i18n="desc">你的 AI Vlog 导演。留下邮箱，产品上线后第一时间通知你。</p>
    </section>

    <div class="card" id="signupCard">
      <h2 class="card-title" data-i18n="signupTitle">留下邮箱</h2>
      <form class="form" id="waitlistForm" novalidate>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="your@email.com" data-i18n-placeholder="emailPlaceholder" />
        <button type="submit" class="btn" id="submitBtn" data-i18n="submit">我要体验</button>
        <p class="msg" id="formMessage" role="status"></p>
      </form>
    </div>

    <div class="card hidden" id="successCard">
      <p class="status is-free" data-i18n="successTitle">✓ 已收到申请</p>
      <p class="success-desc" data-i18n="successDesc">产品开放时我们会通过邮箱通知你，感谢关注 Javen。</p>
    </div>

    <p class="reel-mark" aria-hidden="true">— reel 01 —</p>
  </main>

  <script src="config.js?v=20260802a"></script>
  <script src="app.js?v=20260802-film2"></script>
</body>
</html>
