<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Javen · 抢先体验 AI Vlog 导演" />
  <meta name="theme-color" content="#0D0D0D" />
  <title>Javen · 抢先体验</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260731d" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg width="30" height="14" viewBox="0 0 30 14" fill="none">
            <path
              d="M19.2 3.2c4.6 0 4.6 7.6 0 7.6-4.6 0-6.5-7.6-12.4-7.6-4.2 0-4.2 7.6 0 7.6 5.9 0 7.8-7.6 12.4-7.6z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <strong>Javen <span class="logo-sep">|</span> <span data-i18n="logoMain">你的 AI Vlog 导演</span></strong>
      </div>
      <button class="lang-toggle" id="langToggle" type="button">EN</button>
    </header>

    <section class="hero">
      <span class="hero-badge" data-i18n="badge">抢先体验</span>
      <h1 data-i18n="title">Javen</h1>
      <p class="hero-desc" data-i18n="desc">你的 AI Vlog 导演。留下邮箱，产品上线后第一时间通知你。</p>
    </section>

    <div class="card" id="signupCard">
      <h2 class="card-title" data-i18n="signupTitle">留下邮箱</h2>
      <form class="form" id="waitlistForm" novalidate>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="your@email.com" data-i18n-placeholder="emailPlaceholder" />
        <button type="submit" class="btn" id="submitBtn" data-i18n="submit">我要体验</button>
        <p class="msg" id="formMessage" role="status"></p>
      </form>
    </div>

    <div class="card hidden" id="successCard">
      <p class="status is-free" data-i18n="successTitle">✓ 已收到申请</p>
      <p class="success-desc" data-i18n="successDesc">产品开放时我们会通过邮箱通知你，感谢关注 Javen。</p>
    </div>
  </main>

  <script src="config.js?v=20260731h"></script>
  <script src="app.js?v=20260731h"></script>
</body>
</html>
